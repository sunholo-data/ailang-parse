name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      # curl -sL https://github.com/sunholo-data/ailang/releases/latest/download/linux.x64.ailang.tar.gz | tar -xz
      - name: Install ailang (dev branch — needs @route support)
        env:
          # AILANG's go.mod may pin a Go toolchain newer than what setup-go
          # provisions. setup-go@v6 defaults GOTOOLCHAIN=local, which blocks
          # the auto-toolchain fallback. Switch to `auto` so Go downloads
          # whatever go.mod requires.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/
          ailang --version

      - name: Install package dependencies
        run: ailang lock

      - name: Type-check all modules
        run: ./bin/docparse --check

      - name: Check WASM bindings (source ↔ wasm-demo.js ↔ vendor script)
        run: python3 docs/scripts/check-wasm-bindings.py

      - name: Check WASM freshness (binary vs .ail source commits)
        run: python3 docs/scripts/check-wasm-freshness.py

      - name: Check Claude Code install docs (commands match the live skill repo)
        run: python3 docs/scripts/check-install-docs.py

      - name: Check doc examples (data-src targets exist, fallbacks match, files compile)
        run: python3 docs/scripts/check-doc-examples.py

      - name: Frontend unit tests (docparse-blocks.js)
        run: node --test docs/js/__tests__/*.test.mjs

      - name: Run inline tests (60+ test cases)
        run: |
          # Run tests and check that all non-property tests pass
          # Property tests (auto-generated from ensures contracts) have a known AILANG bug
          # and are expected to fail — only count actual test case failures
          OUTPUT=$(./bin/docparse --test 2>&1) || true
          echo "$OUTPUT"
          # Extract pass/fail counts and check for real test failures (not property tests)
          REAL_FAILURES=$(echo "$OUTPUT" | grep -c "✗.*_test_" || true)
          if [ "$REAL_FAILURES" -gt 0 ]; then
            echo "::error::$REAL_FAILURES inline test(s) failed"
            exit 1
          fi
          echo "All inline tests passed (property test failures are known AILANG bugs)"

  floor-check:
    # Guards against the manifest advertising a lower AILANG floor than the code
    # actually needs. The other jobs build the `dev` toolchain, which satisfies
    # ANY `ailang = ">=X"` — so the declared minimum is never exercised. Here we
    # install exactly the version named in the constraint and compile against it:
    # if it doesn't build, the constraint is a lie and a consumer on that toolchain
    # would hit a silent boot failure. Skips gracefully if the floor isn't released
    # yet (a pre-release floor can't be compiled against).
    name: Minimum AILANG Floor Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Compile against the declared minimum AILANG version
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          FLOOR=$(grep -E '^ailang[[:space:]]*=' ailang.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$FLOOR" ]; then
            echo "::error::could not parse an X.Y.Z floor from the 'ailang = \">=...\"' line in ailang.toml"
            exit 1
          fi
          TAG="v$FLOOR"
          echo "Declared minimum AILANG: $TAG"
          if ! git ls-remote --exit-code --tags https://github.com/sunholo-data/ailang.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::AILANG $TAG is not released yet — floor-compile check pending until it ships. Skipping."
            exit 0
          fi
          git clone --depth 1 --branch "$TAG" https://github.com/sunholo-data/ailang.git /tmp/ailang-floor
          cd /tmp/ailang-floor && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          ailang --version
          # Resolve deps and type-check the whole package with the floor toolchain.
          # If this fails, raise the constraint in ailang.toml to a version that compiles.
          ailang lock
          ./bin/docparse --check

  check-windows:
    name: Windows CLI Smoke Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install ailang (dev branch — needs @route support)
        shell: pwsh
        env:
          # See ci.yml::check::Install ailang — setup-go@v6 sets
          # GOTOOLCHAIN=local; switch to auto so AILANG's go.mod toolchain
          # pin can fetch the required Go version.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git $env:RUNNER_TEMP\ailang-src
          cd $env:RUNNER_TEMP\ailang-src
          go build -o "$env:RUNNER_TEMP\ailang-src\ailang.exe" ./cmd/ailang
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ailang-src"
          & "$env:RUNNER_TEMP\ailang-src\ailang.exe" --version

      - name: Install package dependencies
        shell: pwsh
        run: ailang lock

      - name: Type-check via Windows CLI wrapper (bin\docparse.cmd --check)
        shell: cmd
        run: bin\docparse.cmd --check

      - name: Parse a sample file via Windows CLI wrapper
        shell: cmd
        run: bin\docparse.cmd data\test_files\comments.docx

  wasm-smoke:
    # Browser-level smoke test for the in-browser WASM bundle. Loads the
    # pinned ailang.wasm + vendored modules into a real Chromium, parses a
    # fixture DOCX, and asserts on the rendered output. Catches runtime
    # regressions inside ailang.wasm that the static check-wasm-bindings.py
    # invariants cannot detect.
    name: Browser WASM Smoke Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download pinned AILANG WASM runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN_FILE="docs/wasm/.ailang-version"
          RELEASE_TAG=$(head -n1 "$PIN_FILE" | tr -d '[:space:]')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::$PIN_FILE is empty"
            exit 1
          fi
          echo "Pinned release: $RELEASE_TAG"
          curl -sfL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o ailang-wasm.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/ailang-wasm.tar.gz"
          tar -xzf ailang-wasm.tar.gz
          mv ailang.wasm docs/wasm/
          [ -f wasm_exec.js ] && mv wasm_exec.js docs/wasm/
          [ -f ailang-repl.js ] && mv ailang-repl.js docs/wasm/
          rm -f ailang-wasm.tar.gz

      - name: Vendor AILANG modules + packages
        run: bash docs/scripts/vendor-wasm-packages.sh --skip-wasm

      - name: Stamp ailangVersion + cache-bust (mirror pages.yml)
        run: |
          set -euo pipefail
          RELEASE_TAG=$(head -n1 docs/wasm/.ailang-version | tr -d '[:space:]')
          sed -i "s/ailangVersion: \".*\"/ailangVersion: \"$RELEASE_TAG\"/" docs/js/site-data.js
          sed -i "s|wasm/ailang.wasm?v=[^'\"]*|wasm/ailang.wasm?v=$RELEASE_TAG|" docs/js/wasm-demo.js

      - name: Build _site/
        run: |
          rm -rf _site
          cp -r docs/ _site/
          ls -lh _site/wasm/

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests/browser
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/browser/playwright-report/
          retention-days: 14

  sdk-tests:
    name: SDK Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Python SDK
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Python SDK tests
        run: cd sdks/python && uv run --extra dev pytest tests/ -v

      # JS SDK
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run JS SDK tests
        run: cd sdks/js && npx --yes tsx --test tests/client.test.ts

      # Go SDK
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Run Go SDK tests
        run: cd sdks/go && go test -v ./...

      # R SDK
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::httptest2
          needs: check

      - name: R CMD check (--as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: sdks/r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  sdk-integration:
    name: SDK Integration Tests (live API)
    runs-on: ubuntu-latest
    needs: sdk-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies (integration)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: |
            any::testthat
            any::withr
          needs: check

      - name: Python integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/python && uv run --extra dev pytest tests/test_integration.py -v

      - name: JS integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/js && npx --yes tsx --test tests/integration.test.ts

      - name: Go integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/go && go test -v -run Integration ./...

      - name: R integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
          NOT_CRAN: "true"
        run: |
          R CMD INSTALL sdks/r
          cd sdks/r && Rscript -e 'testthat::test_dir("tests/testthat", filter = "integration", reporter = "summary")'

  benchmark:
    name: Structural Benchmark (53 files)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      - name: Install ailang (dev branch — needs @route support)
        env:
          # See ci.yml::check — setup-go@v6 defaults GOTOOLCHAIN=local
          # which blocks the auto-toolchain fallback AILANG's go.mod needs.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/

      - name: Install package dependencies
        run: ailang lock

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Download test files
        run: bash benchmarks/download_test_files.sh

      - name: Run structural benchmark (53 files, must be 100%)
        run: uv run benchmarks/run_benchmarks.py --suite office
