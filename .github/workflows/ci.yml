name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      # curl -sL https://github.com/sunholo-data/ailang/releases/latest/download/linux.x64.ailang.tar.gz | tar -xz
      - name: Install ailang (dev branch — needs @route support)
        env:
          # AILANG's go.mod may pin a Go toolchain newer than what setup-go
          # provisions. setup-go@v6 defaults GOTOOLCHAIN=local, which blocks
          # the auto-toolchain fallback. Switch to `auto` so Go downloads
          # whatever go.mod requires.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/
          ailang --version

      - name: Install package dependencies
        run: ailang lock

      # --check and --prove only cover what bin/docparse's MODULES array lists,
      # and it had drifted: 12 modules were in neither, including tex_parser.ail
      # with 19 contracts — more than any other module here.
      - name: Check MODULES lists every .ail module
        run: python3 docs/scripts/check-module-list.py

      # RTF parsed fine for weeks while every format list denied it. The lists
      # are hand-maintained by design; this makes each difference from the
      # router declared rather than accidental.
      - name: Check advertised formats match format_router
        run: python3 docs/scripts/check-format-lists.py

      - name: Type-check all modules
        run: ./bin/docparse --check

      # Gates on VIOLATIONs — a contract we wrote turning out to be false.
      # Skips (Z3's decidable fragment is narrow) and encoder errors
      # (sunholo-data/ailang#755-757) are reported but do not fail the build,
      # since neither is fixable from this repo and a permanently-red gate is
      # a gate nobody reads. Until now no workflow ran contract verification
      # at all, so every contract in the repo was decoration.
      - name: Verify contracts with Z3 (fails on violations)
        run: ./bin/docparse --prove

      # Static verification skips most parser code, so also exercise the
      # contracts at runtime over real documents, where they do fire.
      - name: Runtime contract checks over sample documents
        run: |
          set -euo pipefail
          for f in data/test_files/comments.docx \
                   data/test_files/pandoc_inline_images.docx \
                   data/test_files/challenge_real_world.docx; do
            [ -f "$f" ] || continue
            echo "── $f"
            ailang run --verify-contracts --caps IO,FS,Env,Clock,Net,Process \
              --entry main docparse/main.ail "$f" > /dev/null
          done
          echo "No contract violated at runtime."

      - name: Check WASM bindings (source ↔ wasm-demo.js ↔ vendor script)
        run: python3 docs/scripts/check-wasm-bindings.py

      # check-wasm-freshness.py is deliberately NOT run here. It compares git
      # commit timestamps, and actions/checkout defaults to a shallow clone, so
      # every file reports the same commit and the comparison can never fire —
      # it has never once failed. Locally it is the opposite problem: any .ail
      # edit trips it, because editing a file does not imply using new syntax.
      #
      # The real coverage is two checks that do work, both above/below:
      #   check-wasm-bindings.py  — version-FLOOR check on the loaded subset,
      #                             i.e. does the pin actually support what we
      #                             load (semantic, not chronological)
      #   wasm-smoke job          — loads the pinned ailang.wasm and the
      #                             vendored modules into real Chromium and
      #                             parses a document

      - name: Check Claude Code install docs (commands match the live skill repo)
        run: python3 docs/scripts/check-install-docs.py

      - name: Check doc examples (data-src targets exist, fallbacks match, files compile)
        run: python3 docs/scripts/check-doc-examples.py

      - name: Frontend unit tests (docparse-blocks.js)
        run: node --test docs/js/__tests__/*.test.mjs

      - name: Run inline tests (60+ test cases)
        run: |
          # Run tests and check that all non-property tests pass
          # Property tests (auto-generated from ensures contracts) have a known AILANG bug
          # and are expected to fail — only count actual test case failures
          OUTPUT=$(./bin/docparse --test 2>&1) || true
          echo "$OUTPUT"
          # Extract pass/fail counts and check for real test failures (not property tests)
          REAL_FAILURES=$(echo "$OUTPUT" | grep -c "✗.*_test_" || true)
          if [ "$REAL_FAILURES" -gt 0 ]; then
            echo "::error::$REAL_FAILURES inline test(s) failed"
            exit 1
          fi
          echo "All inline tests passed (property test failures are known AILANG bugs)"

      # Through the real CLI: a Maildir-named / extensionless message parses
      # as email (it was refused as 'unknown'), and a forwarded message
      # (message/rfc822) carries attachment-data that decodes to its bytes.
      # The Maildir name is made at run time — ':' breaks Windows checkout.
      - name: EML content sniffing and message/rfc822 attachment bytes
        run: bash tests/test_eml_maildir_rfc822.sh

      # Checked against the fixture builder's expectations rather than a
      # golden: a golden can carry the bug (poi_two_sheets' did).
      - name: XLSX cell positions and sheet order (exact)
        run: python3 benchmarks/check_xlsx_positions.py

      # Same reasoning for DOCX runs and anchors: a dropped run colour, a
      # footnote whose text never arrives, a lost bookmark or a warning that
      # never fires all score 100% in the office suite.
      - name: DOCX run colour, notes, bookmarks and warnings (exact)
        run: python3 benchmarks/check_docx_runs.py
      # Same rationale: custom heading styles, nested lists and page/section
      # breaks each sat in a golden as the defect (body text, one-item lists,
      # empty paragraphs) at 100%. Expectations come from how the fixtures
      # were built; docx -> md and docx -> docx round trips must not crash and
      # docx -> docx must keep headings and list nesting.
      - name: DOCX headings, nested lists and breaks (exact)
        run: python3 benchmarks/check_docx_structure.py

  floor-check:
    # Guards against the manifest advertising a lower AILANG floor than the code
    # actually needs. The other jobs build the `dev` toolchain, which satisfies
    # ANY `ailang = ">=X"` — so the declared minimum is never exercised. Here we
    # install exactly the version named in the constraint and compile against it:
    # if it doesn't build, the constraint is a lie and a consumer on that toolchain
    # would hit a silent boot failure. Skips gracefully if the floor isn't released
    # yet (a pre-release floor can't be compiled against).
    name: Minimum AILANG Floor Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Compile against the declared minimum AILANG version
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          FLOOR=$(grep -E '^ailang[[:space:]]*=' ailang.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$FLOOR" ]; then
            echo "::error::could not parse an X.Y.Z floor from the 'ailang = \">=...\"' line in ailang.toml"
            exit 1
          fi
          TAG="v$FLOOR"
          echo "Declared minimum AILANG: $TAG"
          if ! git ls-remote --exit-code --tags https://github.com/sunholo-data/ailang.git "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::AILANG $TAG is not released yet — floor-compile check pending until it ships. Skipping."
            exit 0
          fi
          git clone --depth 1 --branch "$TAG" https://github.com/sunholo-data/ailang.git /tmp/ailang-floor
          cd /tmp/ailang-floor && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          ailang --version
          # Resolve deps and type-check the whole package with the floor toolchain.
          # If this fails, raise the constraint in ailang.toml to a version that compiles.
          ailang lock
          ./bin/docparse --check

  check-windows:
    name: Windows CLI Smoke Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install ailang (dev branch — needs @route support)
        shell: pwsh
        env:
          # See ci.yml::check::Install ailang — setup-go@v6 sets
          # GOTOOLCHAIN=local; switch to auto so AILANG's go.mod toolchain
          # pin can fetch the required Go version.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git $env:RUNNER_TEMP\ailang-src
          cd $env:RUNNER_TEMP\ailang-src
          go build -o "$env:RUNNER_TEMP\ailang-src\ailang.exe" ./cmd/ailang
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ailang-src"
          & "$env:RUNNER_TEMP\ailang-src\ailang.exe" --version

      - name: Install package dependencies
        shell: pwsh
        run: ailang lock

      - name: Type-check via Windows CLI wrapper (bin\docparse.cmd --check)
        shell: cmd
        run: bin\docparse.cmd --check

      - name: Parse a sample file via Windows CLI wrapper
        shell: cmd
        run: bin\docparse.cmd data\test_files\comments.docx

  wasm-smoke:
    # Browser-level smoke test for the in-browser WASM bundle. Loads the
    # pinned ailang.wasm + vendored modules into a real Chromium, parses a
    # fixture DOCX, and asserts on the rendered output. Catches runtime
    # regressions inside ailang.wasm that the static check-wasm-bindings.py
    # invariants cannot detect.
    name: Browser WASM Smoke Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download pinned AILANG WASM runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN_FILE="docs/wasm/.ailang-version"
          RELEASE_TAG=$(head -n1 "$PIN_FILE" | tr -d '[:space:]')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::$PIN_FILE is empty"
            exit 1
          fi
          echo "Pinned release: $RELEASE_TAG"
          curl -sfL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o ailang-wasm.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/ailang-wasm.tar.gz"
          tar -xzf ailang-wasm.tar.gz
          mv ailang.wasm docs/wasm/
          [ -f wasm_exec.js ] && mv wasm_exec.js docs/wasm/
          [ -f ailang-repl.js ] && mv ailang-repl.js docs/wasm/
          rm -f ailang-wasm.tar.gz

      - name: Vendor AILANG modules + packages
        run: bash docs/scripts/vendor-wasm-packages.sh --skip-wasm

      - name: Stamp ailangVersion + cache-bust (mirror pages.yml)
        run: |
          set -euo pipefail
          RELEASE_TAG=$(head -n1 docs/wasm/.ailang-version | tr -d '[:space:]')
          sed -i "s/ailangVersion: \".*\"/ailangVersion: \"$RELEASE_TAG\"/" docs/js/site-data.js
          sed -i "s|wasm/ailang.wasm?v=[^'\"]*|wasm/ailang.wasm?v=$RELEASE_TAG|" docs/js/wasm-demo.js

      - name: Build _site/
        run: |
          rm -rf _site
          cp -r docs/ _site/
          ls -lh _site/wasm/

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests/browser
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/browser/playwright-report/
          retention-days: 14

  sdk-tests:
    name: SDK Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Python SDK
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Python SDK tests
        run: cd sdks/python && uv run --extra dev pytest tests/ -v

      # JS SDK
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run JS SDK tests
        run: cd sdks/js && npx --yes tsx --test tests/client.test.ts

      # Go SDK
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Run Go SDK tests
        run: cd sdks/go && go test -v ./...

      # R SDK
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::httptest2
          needs: check

      - name: R CMD check (--as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: sdks/r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  sdk-integration:
    name: SDK Integration Tests (live API)
    runs-on: ubuntu-latest
    needs: sdk-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies (integration)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: |
            any::testthat
            any::withr
          needs: check

      - name: Python integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/python && uv run --extra dev pytest tests/test_integration.py -v

      - name: JS integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/js && npx --yes tsx --test tests/integration.test.ts

      - name: Go integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
        run: cd sdks/go && go test -v -run Integration ./...

      - name: R integration tests
        if: env.DOCPARSE_API_KEY != ''
        env:
          DOCPARSE_API_KEY: ${{ secrets.DOCPARSE_API_KEY }}
          NOT_CRAN: "true"
        run: |
          R CMD INSTALL sdks/r
          cd sdks/r && Rscript -e 'testthat::test_dir("tests/testthat", filter = "integration", reporter = "summary")'

  benchmark:
    name: Structural Benchmark (111 files)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      - name: Install ailang (dev branch — needs @route support)
        env:
          # See ci.yml::check — setup-go@v6 defaults GOTOOLCHAIN=local
          # which blocks the auto-toolchain fallback AILANG's go.mod needs.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/

      - name: Install package dependencies
        run: ailang lock

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # poppler supplies the `pdftotext` binary the default PDF backend shells
      # out to. Not needed by the office suite (it parses no PDFs), which is
      # why CI ran without it and had zero coverage of the PDF path — the path
      # the failure check exists to guard.
      - name: Install poppler (pdftotext backend)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # LibreOffice renders a document and reports the COMPUTED style
      # properties, which is the only way to prove a carried template style is
      # actually REACHED. verify_generated.py's L7 stages degrade to SKIP
      # without it, so an absent LibreOffice would turn the style-template
      # checks green while testing nothing — the same shape as the poppler gap
      # above. Installed in the same commit as the first render assertion,
      # deliberately, rather than after the first red run.
      - name: Install LibreOffice (render assertions for style templates)
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress

      - name: Download test files
        run: bash benchmarks/download_test_files.sh

      # The office suite gates on position since G8: section/slide/sheet
      # order, notes and comment placement, table cells by (row, col), block
      # sequence. Before that it gated on counts and bags of words and ALWAYS
      # exited 0, so this step could not fail. This proves the gate still
      # rejects the parser output that shipped v0.47.0's bugs at 100%.
      - name: Office structure gate still catches the v0.47.0 bugs
        run: python3 benchmarks/check_structure_gate.py

      - name: Run structural benchmark (111 files, must be 100%)
        run: uv run benchmarks/run_benchmarks.py --suite office

      # Slide order and notes-to-slide attribution, checked against
      # expectations computed by the fixture's own build script, not a golden
      # (a golden can carry a bug, as poi_two_sheets' did).
      - name: PPTX slide order and speaker-note attribution (exact)
        run: uv run benchmarks/create_pptx_order_fixture.py --verify

      # PPTX -> PPTX used to drop every speaker note. Parses the same fixture,
      # converts it (plain and under three reference decks), parses the result
      # and requires the identical notes on the identical slides, plus the
      # notesSlide/notesMaster wiring in the package.
      - name: PPTX -> PPTX speaker notes round trip (exact)
        run: python3 benchmarks/check_pptx_notes_roundtrip.py

      # Scores the failures, which no other suite looks at: a failed parse must
      # exit non-zero and write nothing. An explicit --pdf-backend failure used
      # to be returned as the document's only block, so the CLI exited 0 and a
      # batch counted the file as parsed.
      - name: Run failure check (failed parses must not write output)
        run: uv run benchmarks/failure_check.py

      # Every document used to write its images to docparse-img-<N> with N
      # restarting at 0, so documents in one batch (or concurrent API requests)
      # overwrote each other's files and an earlier document's `src` named a
      # later document's image. Exact: sha256 of each src file vs its own ZIP.
      - name: Image temp files hold each document's own bytes (exact)
        run: uv run benchmarks/check_image_temp_paths.py

      # These two are named in .claude/rules/benchmarks.md as the guards for
      # "the blind spot" — parse-side goldens and "does the file open" both
      # pass structurally invalid output through — but neither had ever run in
      # CI. The office suite scores JSON goldens and no golden is markdown, so
      # nothing scored the markdown writer; and nothing read a generated
      # document's structure BACK. Three defects reached releases through green
      # CI for exactly this reason.
      - name: Run round-trip check (parse -> markdown -> parse)
        run: uv run benchmarks/roundtrip_check.py

      - name: Verify generated documents (structure, grids, style binding)
        run: uv run benchmarks/verify_generated.py

      - name: Document quality and portable QA regressions
        run: |
          ailang run --quiet --entry main --caps IO,FS,Env,Process \
            --process-allowlist "true,false,mktemp,mkdir,$(command -v soffice),$(command -v pdftoppm)" \
            --process-timeout 120s scripts/verify_document_quality.ail -- \
            "$RUNNER_TEMP/docparse-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$(command -v soffice)" "$(command -v pdftoppm)"
