name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docparse/services/**.ail'
      - 'docparse/types/**.ail'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Check WASM bindings (source ↔ wasm-demo.js ↔ vendor script)
        run: python3 docs/scripts/check-wasm-bindings.py

      - name: Check Claude Code install docs (commands match the live skill repo)
        run: python3 docs/scripts/check-install-docs.py

      - name: Check doc examples (data-src targets exist, fallbacks match, files compile)
        run: python3 docs/scripts/check-doc-examples.py

      - name: Download AILANG WASM runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WASM_DIR="docs/wasm"
          PIN_FILE="$WASM_DIR/.ailang-version"

          echo "::group::Reading pinned AILANG release"
          if [ ! -f "$PIN_FILE" ]; then
            echo "::error::Missing $PIN_FILE — pin file is the single source of truth"
            exit 1
          fi
          RELEASE_TAG=$(head -n1 "$PIN_FILE" | tr -d '[:space:]')
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::$PIN_FILE is empty"
            exit 1
          fi
          echo "Pinned release: $RELEASE_TAG"
          echo "AILANG_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "::endgroup::"

          echo "::group::Downloading ailang-wasm.tar.gz"
          curl -sfL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o ailang-wasm.tar.gz \
            "https://github.com/sunholo-data/ailang/releases/download/${RELEASE_TAG}/ailang-wasm.tar.gz"
          echo "::endgroup::"

          echo "::group::Extracting"
          tar -xzf ailang-wasm.tar.gz
          mv ailang.wasm "$WASM_DIR/"
          [ -f wasm_exec.js ] && mv wasm_exec.js "$WASM_DIR/"
          [ -f ailang-repl.js ] && mv ailang-repl.js "$WASM_DIR/"
          rm -f ailang-wasm.tar.gz
          echo "::endgroup::"

      - name: Vendor AILANG modules + packages from source
        run: |
          # Single source of truth for vendoring — mirrors MODULES_TO_LOAD
          # in docs/js/wasm-demo.js. Skip the WASM download step since the
          # previous step already fetched it from the GitHub release.
          bash docs/scripts/vendor-wasm-packages.sh --skip-wasm

      - name: Stamp version from latest git tag
        run: |
          VERSION=$(git tag --list 'v*' --sort=-version:refname | head -1 | sed 's/^v//')
          echo "Stamping site version: $VERSION"
          sed -i "s/version: \".*\"/version: \"$VERSION\"/" docs/js/site-data.js
          grep 'version:' docs/js/site-data.js | head -1

          echo "Stamping AILANG WASM version: $AILANG_VERSION"
          sed -i "s/ailangVersion: \".*\"/ailangVersion: \"$AILANG_VERSION\"/" docs/js/site-data.js
          grep 'ailangVersion:' docs/js/site-data.js | head -1

          # Cache-bust the WASM URL so browsers don't serve a stale ailang.wasm
          # after a pin bump. The placeholder lives at wasm-demo.js and is
          # rewritten here to match the pinned release.
          sed -i "s|wasm/ailang.wasm?v=[^'\"]*|wasm/ailang.wasm?v=$AILANG_VERSION|" docs/js/wasm-demo.js
          grep "ailang.wasm?v=" docs/js/wasm-demo.js | head -1

      - name: Build site directory
        run: |
          # Build a clean _site/ from docs/ (same pattern as ailang-demos)
          rm -rf _site
          cp -r docs/ _site/
          echo "::group::Site contents"
          ls -lh _site/wasm/
          echo "Total: $(du -sh _site/ | cut -f1)"
          echo "::endgroup::"

      - name: Verify WASM
        run: |
          WASM_SIZE=$(stat --printf='%s' _site/wasm/ailang.wasm)
          if [ "$WASM_SIZE" -lt 1000000 ]; then
            echo "::error::ailang.wasm is only ${WASM_SIZE} bytes (expected >1MB)"
            exit 1
          fi
          echo "ailang.wasm: ${WASM_SIZE} bytes — OK"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
