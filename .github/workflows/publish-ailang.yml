name: Publish AILANG Package

# Trigger on version tags: v0.8.0, v0.9.0, etc.
on:
  push:
    tags:
      - 'v*'
      - '!sdk-v*'  # Exclude SDK tags

jobs:
  validate:
    name: Type Check, Tests & Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      - name: Install ailang (dev branch — needs @route support)
        env:
          # setup-go@v6 defaults GOTOOLCHAIN=local which blocks auto-fetching
          # the toolchain AILANG's go.mod requires. Switch to auto.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/
          ailang --version

      - name: Install package dependencies
        run: ailang lock

      - name: Type-check all modules
        run: ./bin/docparse --check

      - name: Run inline tests
        run: |
          OUTPUT=$(./bin/docparse --test 2>&1) || true
          echo "$OUTPUT"
          REAL_FAILURES=$(echo "$OUTPUT" | grep -c "✗.*_test_" || true)
          if [ "$REAL_FAILURES" -gt 0 ]; then
            echo "::error::$REAL_FAILURES inline test(s) failed"
            exit 1
          fi
          echo "All inline tests passed"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      # poppler supplies the `pdftotext` binary the default PDF backend shells
      # out to. The office suite parses no PDFs, so nothing here needed it.
      - name: Install poppler (pdftotext backend)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download test files
        run: bash benchmarks/download_test_files.sh

      - name: Run structural benchmark (must be 100%)
        run: uv run benchmarks/run_benchmarks.py --suite office

      # Gates the RELEASE on failures, not just on documents that parse. The
      # defect this guards — a failed parse returned as a document containing
      # its own error, exit 0 — shipped past a green office suite, which is
      # the pattern .claude/rules/benchmarks.md calls the blind spot.
      - name: Run failure check (failed parses must not write output)
        run: uv run benchmarks/failure_check.py

  publish:
    name: Publish to AILANG Registry
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # TODO: switch back to release binary once @route and std/xml.escapeXml ship in a release
      - name: Install ailang (dev branch — needs @route support)
        env:
          # setup-go@v6 defaults GOTOOLCHAIN=local which blocks auto-fetching
          # the toolchain AILANG's go.mod requires. Switch to auto.
          GOTOOLCHAIN: auto
        run: |
          git clone --depth 1 --branch dev https://github.com/sunholo-data/ailang.git /tmp/ailang
          cd /tmp/ailang && go build -o ailang ./cmd/ailang && sudo mv ailang /usr/local/bin/

      - name: Install package dependencies
        run: ailang lock

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches ailang.toml version
        run: |
          TOML_VERSION=$(grep '^version' ailang.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TOML_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match ailang.toml version ($TOML_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Verify tag matches pyproject.toml version
        run: |
          BENCH_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$BENCH_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($BENCH_VERSION)"
            exit 1
          fi
          echo "Benchmark version $TAG_VERSION confirmed"

      - name: Dry run (show what will be published)
        env:
          AILANG_REGISTRY_API_KEY: ${{ secrets.AILANG_REGISTRY_API_KEY }}
          AILANG_REGISTRY_VALIDATOR: ${{ secrets.AILANG_REGISTRY_VALIDATOR }}
        # --allow-dotted-tool-names: migration grace for the v0.20.x registry
        # validator change that flags string literals containing '.', '/', '[',
        # '$' as non-provider-safe "tool names". Our DOCX/PPTX/XLSX/ODF parsers
        # advertise ZIP entry path constants (e.g. "[Content_Types].xml",
        # "word/document.xml", "ppt/slides/slide${idx}.xml") that look like
        # tool names to the scanner. Proper migration (rename advertised names
        # or stop emitting them) is tracked separately; this flag keeps shipping
        # until that lands.
        run: ailang publish --dry-run --allow-dotted-tool-names

      - name: Publish to AILANG registry
        env:
          AILANG_REGISTRY_API_KEY: ${{ secrets.AILANG_REGISTRY_API_KEY }}
          AILANG_REGISTRY_VALIDATOR: ${{ secrets.AILANG_REGISTRY_VALIDATOR }}
        run: ailang publish --allow-dotted-tool-names
