name: Publish SDKs

# Trigger on version tags: sdk-v0.1.0, sdk-v0.2.0, etc.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  test-sdks:
    name: Test SDKs before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Python SDK tests
        run: cd sdks/python && uv run --extra dev pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS SDK tests
        run: cd sdks/js && npx --yes tsx --test tests/client.test.ts

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go SDK tests
        run: cd sdks/go && go test -v ./...

  publish-python:
    name: Publish Python SDK to PyPI
    needs: test-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject.toml version
        run: |
          cd sdks/python
          FILE_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match sdks/python/pyproject.toml version ($FILE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Build package
        run: cd sdks/python && uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  publish-npm:
    name: Publish JS SDK to npm
    needs: test-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          cd sdks/js
          FILE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match sdks/js/package.json version ($FILE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Publish to npm (trusted publishing via OIDC)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd sdks/js && npm publish --access public --provenance

  publish-go:
    name: Publish Go SDK
    needs: test-sdks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GO_DEPLOY_KEY }}

      - name: Push to ailang-parse-go repo and tag
        run: |
          cd sdks/go
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git remote add origin git@github.com:sunholo-data/ailang-parse-go.git
          git push --force origin main
          git push --force origin "v${{ steps.version.outputs.version }}"
