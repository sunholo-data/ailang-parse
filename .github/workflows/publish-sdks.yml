name: Publish SDKs

# Trigger on version tags: sdk-v0.1.0, sdk-v0.2.0, etc.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  test-sdks:
    name: Test SDKs before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Python SDK tests
        run: cd sdks/python && uv run --extra dev pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS SDK tests
        run: cd sdks/js && npx --yes tsx --test tests/client.test.ts

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go SDK tests
        run: cd sdks/go && go test -v ./...

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::httptest2
          needs: check
      - name: R CMD check (--as-cran)
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: sdks/r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  publish-python:
    name: Publish Python SDK to PyPI
    needs: test-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pyproject.toml version
        run: |
          cd sdks/python
          FILE_VERSION=$(grep '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match sdks/python/pyproject.toml version ($FILE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Build package
        run: cd sdks/python && uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  publish-npm:
    name: Publish JS SDK to npm
    needs: test-sdks
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing requires >=11.5)
        run: npm install -g npm@11.5.0 && npm --version

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          cd sdks/js
          FILE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match sdks/js/package.json version ($FILE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Publish to npm (trusted publishing via OIDC)
        run: cd sdks/js && npm publish --access public --provenance

  publish-go:
    name: Publish Go SDK
    needs: test-sdks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GO_DEPLOY_KEY }}

      - name: Push to ailang-parse-go repo and tag
        run: |
          cd sdks/go
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git remote add origin git@github.com:sunholo-data/ailang-parse-go.git
          git push --force origin main
          git push --force origin "v${{ steps.version.outputs.version }}"

  publish-r:
    name: Publish R SDK (GitHub Release)
    needs: test-sdks
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create releases and upload assets
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: sdks/r
          needs: check

      - name: Verify tag matches DESCRIPTION version
        run: |
          cd sdks/r
          FILE_VERSION=$(grep '^Version:' DESCRIPTION | sed 's/Version: //')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match sdks/r/DESCRIPTION version ($FILE_VERSION)"
            exit 1
          fi
          echo "Version $TAG_VERSION confirmed"

      - name: Build R source tarball
        run: |
          R CMD build sdks/r
          ls -la ailangparse_*.tar.gz

      - name: Create GitHub Release and upload tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="ailangparse_${VERSION}.tar.gz"
          cat > /tmp/release-notes.md <<EOF
          AILANG Parse SDK release ${VERSION}. R source tarball attached.

          Install via the attached tarball:
          \`\`\`r
          install.packages(
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL}",
            repos = NULL, type = "source"
          )
          \`\`\`

          Or directly from the repo subdir:
          \`\`\`r
          remotes::install_github("${GITHUB_REPOSITORY}", subdir = "sdks/r", ref = "${TAG}")
          \`\`\`
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "SDKs $TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" "$TARBALL" --clobber
