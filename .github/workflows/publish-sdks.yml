name: Publish SDKs

# Trigger on version tags: sdk-v0.1.0, sdk-v0.2.0, etc.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish-python:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Update version in pyproject.toml
        run: |
          cd sdks/python
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          cat pyproject.toml | grep "^version"

      - name: Build package
        run: cd sdks/python && uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  publish-npm:
    name: Publish JS SDK to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC publishing requires >=11.5)
        run: npm install -g npm@latest && npm --version

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Update version in package.json
        run: |
          cd sdks/js
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version
          cat package.json | grep '"version"'

      - name: Publish to npm (trusted publishing via OIDC)
        run: cd sdks/js && npm publish --access public --provenance

  publish-go:
    name: Publish Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GO_DEPLOY_KEY }}

      - name: Push to ailang-parse-go repo and tag
        run: |
          cd sdks/go
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git remote add origin git@github.com:sunholo-data/ailang-parse-go.git
          git push --force origin main
          git push --force origin "v${{ steps.version.outputs.version }}"
