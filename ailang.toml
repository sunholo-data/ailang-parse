[package]
name = "sunholo/ailang_parse"
module_prefix = "docparse"
version = "0.46.0"
edition = "1"
ailang = ">=0.35.0"
description = "Universal document parsing and generation"

# Required by the registry since AILANG v0.41.0 (PUB002): what this version is.
[release]
kind = "feature"

[exports]
modules = [
  "docparse/types/document",
  "docparse/services/format_router",
  "docparse/services/orchestrator",
  "docparse/services/markdown_writer",
  "docparse/services/console_report",
  "docparse/services/output_formatter",
  "docparse/services/chunker",
  "docparse/services/zip_extract",
  "docparse/services/xml_helpers",
  "docparse/services/odf_text",
  "docparse/services/odf_runs",
  "docparse/services/colour",
  "docparse/services/docparse_generate",
  "docparse/services/omml",
  "docparse/services/docx_parser",
  "docparse/services/pptx_parser",
  "docparse/services/xlsx_parser",
  "docparse/services/csv_parser",
  "docparse/services/markdown_parser",
  "docparse/services/rtf_parser",
  "docparse/services/html_parser",
  "docparse/services/eml_parser",
  "docparse/services/epub_parser",
  "docparse/services/odt_parser",
  "docparse/services/odp_parser",
  "docparse/services/ods_parser",
  "docparse/services/tex_parser",
  "docparse/services/tex_input_resolver",
  "docparse/services/tex_archive_extract",
  "docparse/services/direct_ai_parser",
  "docparse/services/pdf_backend_external",
  "docparse/services/pdf_annotations",
  "docparse/services/layout_ai",
  "docparse/services/a2ui_formatter",
  "docparse/services/unstructured_compat",
  "docparse/services/html_generator",
  "docparse/services/docx_generator",
  "docparse/services/docx_template",
  "docparse/services/docx_layout",
  "docparse/services/docx_audit",
  "docparse/services/document_render",
  "docparse/services/pptx_generator",
  "docparse/services/xlsx_generator",
  "docparse/services/odt_generator",
  "docparse/services/odf_template",
  "docparse/services/pptx_template",
  "docparse/services/odp_generator",
  "docparse/services/ods_generator",
  "docparse/services/qmd_generator",
  "docparse/services/ai_generator",
  "docparse/services/samples",
  "docparse/services/tools",
  "docparse/services/mcp/tools",
  "docparse/services/mcp/estimate",
  "docparse/services/mcp/auth",
  "docparse/services/mcp/account",
  "docparse/services/eval"
