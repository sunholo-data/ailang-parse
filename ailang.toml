[package]
name = "sunholo/docparse"
module_prefix = "docparse"
version = "0.8.0"
edition = "1"
ailang = ">=0.9.5"
description = "Universal document parsing and generation"

[exports]
modules = [
  "docparse/types/document",
  "docparse/services/format_router",
  "docparse/services/output_formatter"
]

[dependencies]
"sunholo/a2ui" = "0.1.0"
"sunholo/logging" = "0.3.0"

[effects]
max = ["IO", "FS", "AI", "Env"]

[metadata]
tags = ["document-parsing", "office", "pdf", "ai"]
ai_summary = "Universal document parsing for Office, PDF, and image formats"

[stability]
level = "experimental"
