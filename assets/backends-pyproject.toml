# Minimal uv project for the local PDF backends.
#
# The installer copies this to <prefix>/pyproject.toml so that
# pdf_backend_external's `uv run --project <PROJECT_DIR>` resolves docling and
# liteparse from a lean environment. In a clone, PROJECT_DIR is the repo root
# and uv resolves the benchmark pyproject.toml instead — which also carries
# these two, alongside the whole competitor stack.
[project]
name = "docparse-backends"
version = "0.0.0"
description = "Local PDF backends for the AILANG Parse CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backends = [
    "docling",
    "liteparse",
]
