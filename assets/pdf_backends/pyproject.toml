# uv project for the bundled PDF backends — ships in the package under
# assets/pdf_backends/, next to adapter.py.
#
# This is the project `pdf_backend_external`'s `uv run --project <dir>` resolves
# when there is no DOCPARSE_PROJECT_ROOT — i.e. the `ailang install` shim flow
# (`docparse-pdf`), which has no wrapper to run `uv sync --extra backends` for
# the user. docling and liteparse are therefore DEFAULT dependencies, so a
# plain `uv run` materialises the environment on first use. In a clone or an
# install.sh prefix the wrapper sets DOCPARSE_PROJECT_ROOT and uv resolves the
# repo's (or prefix's) pyproject.toml instead — this file is not consulted
# there, and assets/backends-pyproject.toml keeps serving the --install-backends
# extra flow.
#
# No uv.lock ships: producing one requires resolving docling and liteparse
# against the network at packaging time. `uv run --project` generates the lock
# in this directory on first use and pins it thereafter.
[project]
name = "docparse-backends"
version = "0.0.0"
description = "Local PDF backends for the AILANG Parse CLI"
requires-python = ">=3.11"
dependencies = [
    "docling",
    "liteparse",
]