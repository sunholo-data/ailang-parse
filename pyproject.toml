[project]
name = "docparse-benchmarks"
version = "0.53.0"
description = "Benchmarks for AILANG Parse document parser"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8",
    "markdown-it-py>=3",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
competitors = [
    "unstructured[docx,pptx,xlsx,odt,epub,md]",
    "docling",
    "docling-slim[format-opendocument]",
    "llama-parse",
    "markitdown[all]",
    "kreuzberg>=4.0.0",
    "liteparse",
]
