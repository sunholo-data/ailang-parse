[project]
name = "docparse-benchmarks"
version = "0.15.0"
description = "Benchmarks for AILANG Parse document parser"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8",
]

[project.optional-dependencies]
competitors = [
    "unstructured[docx,pptx,xlsx,pdf]",
    "docling",
    "llama-parse",
    "markitdown[all]",
    "kreuzberg>=4.0.0",
    "liteparse",
]
