[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailang-parse"
version = "0.9.0"
description = "Python client and MCP server for the AILANG Parse document parsing API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "Sunholo", email = "dev@sunholo.com" }]
keywords = ["ailang-parse", "document-parsing", "unstructured", "ailang", "docparse", "office-parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = ["requests>=2.20"]

[project.optional-dependencies]
async = ["httpx>=0.24"]
gcs = ["google-cloud-storage>=2.0,<4"]
s3 = ["boto3>=1.28,<2"]
dev = ["pytest>=7.0"]

[project.scripts]
ailang-parse = "ailang_parse.cli:main"

[project.urls]
Homepage = "https://www.sunholo.com/ailang-parse/"
Repository = "https://github.com/sunholo-data/ailang-parse"
Documentation = "https://www.sunholo.com/ailang-parse/api.html"
